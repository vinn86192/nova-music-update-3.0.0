name: NovaMusic 3.0.0 APK Builder

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract zip (jika source diupload sebagai .zip)
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, zipfile
          zips = [z for z in glob.glob('**/*.zip', recursive=True) if not z.startswith('.git/')]
          for z in zips:
              dest = os.path.join('extracted', os.path.splitext(os.path.basename(z))[0])
              print('Extracting', z, '->', dest)
              with zipfile.ZipFile(z) as zf:
                  for info in zf.infolist():
                      name = info.filename.replace('\\', '/')
                      if name.startswith('/') or '..' in name.split('/'):
                          continue
                      target = os.path.join(dest, name)
                      if name.endswith('/'):
                          os.makedirs(target, exist_ok=True)
                          continue
                      os.makedirs(os.path.dirname(target), exist_ok=True)
                      with zf.open(info) as src, open(target, 'wb') as out:
                          out.write(src.read())
          PY

      - name: Locate Android project
        shell: bash
        run: |
          SETTINGS=""
          while IFS= read -r f; do
            d=$(dirname "$f")
            if grep -qs 'versionName = "3.0.0"' "$d/app/build.gradle.kts"; then
              SETTINGS="$f"
              break
            fi
            [ -z "$SETTINGS" ] && SETTINGS="$f"
          done < <(find . -path ./.git -prune -o -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle(.kts) tidak ditemukan. Isi repo:"
            find . -path ./.git -prune -o -maxdepth 4 -print | head -80
            exit 1
          fi

          PROJECT_DIR=$(cd "$(dirname "$SETTINGS")" && pwd)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p "$PROJECT_DIR" assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovaMusic-3.0.0-APK
          path: |
            **/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload build log (jika gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NovaMusic-3.0.0-build-log
          path: build.log
          if-no-files-found: ignore
